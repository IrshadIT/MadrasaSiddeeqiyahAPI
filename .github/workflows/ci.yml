
name: .NET CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - fix/p0-security

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./MadrasaSiddeeqiyahAPI.sln

      - name: Build solution
        run: dotnet build ./MadrasaSiddeeqiyahAPI.sln --configuration Release --no-restore
